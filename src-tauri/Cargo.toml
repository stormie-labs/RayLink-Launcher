# RayLink Launcher — Rust workspace (PLAN §1, T1).
# The package here is the Tauri app (src/**, build.rs, tauri.conf.json — T10); the logic lives in crates/*.
# Dependencies are declared once in [workspace.dependencies] (SPEC §1.5). A task that needs a new one adds it in its
# branch; the lead merges (PLAN §4).

[package]
name = "raylink-launcher"
version = "0.2.2"
description = "RayLink Launcher: test stand launcher for the RayLink co-op (S.T.A.L.K.E.R. Anomaly / G.A.M.M.A)"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
rl-core.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-dialog.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[workspace]
resolver = "3"
members = ["crates/rl-fs", "crates/rl-core", "crates/rl-tool"]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
rl-fs = { path = "crates/rl-fs" }
rl-core = { path = "crates/rl-core" }

# Shell (SPEC §1.1, §1.3, §9)
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"

# Core (SPEC §1.5)
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# rustls (aws-lc-rs) + rustls-platform-verifier: system roots, no OpenSSL (SPEC §8.2)
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream", "blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# deflate only (pure Rust zlib-rs): packs are written by publish.ps1 with deflate/store (SPEC §3.2)
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
semver = "1.0.28"
# Windows Credential Manager only (SPEC §3.5)
keyring = { version = "4.2.0", default-features = false, features = ["windows-native-keyring-store"] }
secrecy = "0.10.3"
encoding_rs = "0.8.42"
tracing = "0.1.44"
tracing-appender = "0.2.5"
thiserror = "2.0.21"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

# Tests (SPEC §1.5)
httpmock = "0.9.0"
tempfile = "3.27.0"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# PLAN §0: no unwrap() outside tests (clippy.toml allows it in tests)
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
